schema_version: 1
release_version: 0.1.0
project:
  name: codex-work-watch
  purpose: "High-signal monitoring workflow for Codex and ChatGPT Work availability, routing, credits and reset lifecycle."
  language_default: zh-CN
  mode: condition_watch

sources:
  official:
    - OpenAI Status
    - OpenAI Help
    - Codex releases
    - OpenAI developer documentation
  secondary:
    - GitHub issues
    - maintainer comments
  discovery:
    - search engines
    - third-party trackers

tasks:
  - id: codex-work-watch
    prompt: prompts/codex-work-watch.zh-CN.md
    schedule:
      timezone: Asia/Shanghai
      cadence: hourly
    guarantees:
      - silent_unless_threshold_met
      - source_priority_enforced
      - cursor_monotonicity
      - lifecycle_stage_tracking
      - scope_aware_alerting
      - no_cli_to_desktop_extrapolation
